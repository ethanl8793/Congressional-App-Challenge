<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="webPage.Css">
    <title>Storage for images</title>
</head>
<body>
<div class = "row">
    <div class = "containerForHeadline">
        <h2 class = "headline">
            Input your room dimensions
        </h2>
    </div>
    <div id = "inputDimensionsContainer">
        <div class = "buttonWrap">
            <select class = dropDownUnits>
                <option value = "none">Select unit</option>
                <option value = "inches">Inches</option>
                <option value = "millimeter">Millimeter</option>
                <option value = "feet">Feet</option>
                <option value = "meter">Meter</option>
            </select>
            <input id = 'heightIndicator' placeholder = 'Room height'></input>
        </div>
        <div class = "expandableContainer">
            <div class = "wallDimensionContainer"></div>
        </div>
        <button id = 'submitDimensionsButton' class = 'buttonZoomIn'>Submit</button>
    </div>


    <div class = "container">
        <svg class="viewbox" id = "2dBox" viewbox = "0 0 100 130" >
            <rect class="rect" width = "100" height = "130"></rect>
        </svg>
        <div class = "canvasButtonsPosition">
            <button class = "restartButton buttonZoomIn textBoxButtons" type = "button">
                <img src = "restartIcon.png" alt = "restart">
            </button>
            <button id = "drawWindow" class = "buttonZoomIn textBoxButtons" type = "button">
                Window
            </button>
            <button id = "drawDoor"class = "buttonZoomIn textBoxButtons" type = "button">
                Door
            </button>
            <button class = "submitButton buttonZoomIn textBoxButtons" type = "button">
                Submit
            </button>
        </div>
        <div id = 'overlayBox'>
            <div id = 'frameText'>
                <button id = 'buttonTextDeny' class = 'denyConfirmOrResetButtons buttonZoomIn' type = 'button'> No </button>
                <button id = 'buttonTextConfirm' class = 'denyConfirmOrResetButtons buttonZoomIn' type = 'button'> Yes </button>
                <button id = 'buttonTextReset' class = 'denyConfirmOrResetButtons buttonZoomIn' type = 'button'> Reset </button>
            </div>
        </div>
    </div>
</div>    
<a href="chooseStyle.html">
    <img src="nextButton.png" alt="Next page" class="nextPageImage">
</a>


<script src = "Catalog.js" type = "module"></script>
<script src = "3dRoom.js"></script>

</body>
</html>
